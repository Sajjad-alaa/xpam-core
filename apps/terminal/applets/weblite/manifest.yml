name: weblite
display_name: XPAM WebLite
version: 5.0.0
comment: Managed browser with shared autofill and interactive verification
author: XPAM
exec_type: exe
stdin: true
# Launch Electron directly to preserve Tinker's stdin pipe and process lifetime.
# The install folder keeps its upstream name: the Tinker agent on the publishing host expects
# applets under %ProgramFiles%/JumpServer/.
path: '%ProgramFiles%/JumpServer/WebLite/weblite.exe'
update_policy: always
type: web
can_concurrent: true
tags: [web]
protocols: [http]
