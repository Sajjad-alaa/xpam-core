- hosts: demo
  gather_facts: no
  become: true
  tasks:
    - name: "Look up account before removal"
      ansible.builtin.getent:
        database: passwd
        key: "{{ account.username }}"
      register: user_info
      ignore_errors: true
      changed_when: false

    - name: Fail when passwd lookup itself is unavailable
      ansible.builtin.fail:
        msg: "{{ user_info.msg | default('Unable to query passwd database') }}"
      when:
        - user_info.failed | default(false)
        - "'One or more supplied key could not be found' not in (user_info.msg | default(''))"

    - name: Record account removal paths
      ansible.builtin.set_fact:
        account_exists: >-
          {{ account.username in
             (user_info.ansible_facts.getent_passwd | default({})) }}
        account_home: >-
          {{ (user_info.ansible_facts.getent_passwd | default({}))
             .get(account.username, ['', '', '', '', ''])[4] }}
        account_uid: >-
          {{ (user_info.ansible_facts.getent_passwd | default({}))
             .get(account.username, ['', '', '', '', ''])[1] }}

    - name: Validate home directory before backup
      ansible.builtin.assert:
        that:
          - account_home.startswith('/')
          - account_home not in ['/', '/bin', '/boot', '/dev', '/etc', '/lib', '/lib64', '/proc', '/root', '/run', '/sbin', '/sys', '/usr', '/var']
          - "'/../' not in account_home"
          - not account_home.endswith('/..')
        fail_msg: "Refusing to move unsafe home directory: {{ account_home }}"
      when: account_exists

    - name: "Check if user home directory exists"
      ansible.builtin.stat:
        path: "{{ account_home }}"
        follow: false
      register: home_dir
      when: account_exists

    - name: Verify home directory belongs to the target account
      ansible.builtin.assert:
        that:
          - not (home_dir.stat.islnk | default(false))
          - (home_dir.stat.uid | string) == (account_uid | string)
        fail_msg: >-
          Refusing to move a home directory not owned by
          {{ account.username }}: {{ account_home }}
      when:
        - account_exists
        - home_dir.stat.exists | default(false)

    - name: Count accounts sharing the target home directory
      ansible.builtin.shell: |
        getent passwd |
          awk -F: -v home="$JMS_ACCOUNT_HOME" '
            $6 == home { count += 1 }
            END { print count + 0 }
          '
      environment:
        JMS_ACCOUNT_HOME: "{{ account_home }}"
      register: shared_home_count
      changed_when: false
      when:
        - account_exists
        - home_dir.stat.exists | default(false)

    - name: Refuse to move a shared home directory
      ansible.builtin.fail:
        msg: "Home directory is shared by multiple accounts: {{ account_home }}"
      when:
        - account_exists
        - home_dir.stat.exists | default(false)
        - shared_home_count.stdout | int > 1

    - name: Check whether the backup path already exists
      ansible.builtin.stat:
        path: "{{ account_home }}.bak"
        follow: false
      register: backup_dir
      when:
        - account_exists
        - home_dir.stat.exists | default(false)

    - name: Choose the backup path (never overwrite an earlier backup)
      ansible.builtin.set_fact:
        home_backup_path: >-
          {{ account_home ~ '.bak' if not (backup_dir.stat.exists | default(false))
             else account_home ~ '.bak-' ~ now(utc=true, fmt='%Y%m%d%H%M%S') }}
      when:
        - account_exists
        - home_dir.stat.exists | default(false)

    - name: "End the account's running processes"
      ansible.builtin.command:
        argv: [pkill, -KILL, -u, "{{ account.username }}"]
      register: pkill_result
      failed_when: pkill_result.rc not in [0, 1]
      changed_when: pkill_result.rc == 0
      when:
        - account_exists
        - params.end_sessions | default(false)

    - name: "Rename user home directory if it exists"
      ansible.builtin.command:
        argv:
          - mv
          - "{{ account_home }}"
          - "{{ home_backup_path }}"
      when:
        - account_exists
        - home_dir.stat.exists | default(false)
        - (params.home_action | default('backup')) != 'delete'

    - name: "Delete user home directory"
      ansible.builtin.file:
        path: "{{ account_home }}"
        state: absent
      when:
        - account_exists
        - home_dir.stat.exists | default(false)
        - (params.home_action | default('backup')) == 'delete'

    - name: "Remove the account's sudo setting"
      ansible.builtin.lineinfile:
        dest: /etc/sudoers
        state: absent
        regexp: "^{{ account.username }} ALL="
        validate: visudo -cf %s

    - name: "Remove account"
      ansible.builtin.user:
        name: "{{ account.username }}"
        state: absent
        remove: false
