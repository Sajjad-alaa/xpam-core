{# XPAM: the policy pages in the console's theme (Settings -> Interface): dark when the theme is dark #}
<style>
    html.dark body { color: #cbd5e1; background: #0f172a; }
    html.dark h1, html.dark h2, html.dark h3, html.dark strong, html.dark b { color: #f1f5f9; }
    html.dark h1, html.dark h2, html.dark h3 { border-color: #1e293b; }
    html.dark .note { background: #111c2e; color: #cbd5e1; }
    html.dark .lang { border-top-color: #334155; }
    html.dark a { color: #38bdf8; }
    html.dark hr { border-color: #1e293b; }
</style>
